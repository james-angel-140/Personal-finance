name: Deploy dashboard to GitHub Pages

# Publishes the static, encrypted dashboard in dashboard/ to GitHub Pages.
# Only the encrypted blob (data.enc.json) and the static assets are deployed —
# never the database or any plaintext (data/ is gitignored).
#
# One-time setup: repo Settings → Pages → Build and deployment →
#   Source = "GitHub Actions".

on:
  push:
    branches: [scaffold-db-foundation, main]
    paths:
      - "dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
